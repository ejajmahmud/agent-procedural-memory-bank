[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-procedural-memory-bank"
version = "0.1.0"
description = "Tool invocation recipe and workflow cache with parameter templating and execution success tracking"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-procedural-memory-bank = "agent_procedural_memory_bank.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_procedural_memory_bank*"]
